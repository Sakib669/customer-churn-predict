[project]
name = "customer-churn-prediction"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
